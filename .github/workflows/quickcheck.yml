name: Run `quickcheck` script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  main:
    runs-on: ubuntu-latest
    # Lint, types and a full build — a couple of minutes. A stalled runner should not sit
    # for GitHub's 6-hour default before the push is reported as broken.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quickcheck (lint + types)
        run: pnpm run quickcheck

      # Not redundant with `quickcheck`, and not only "the control UI".
      #
      # `pnpm run build` compiles the server, the stock UI, the published client bundle and — through
      # `scripts/build-types.mjs` — 223 declaration files. **Nothing else in CI exercises that script**:
      # `test/api/client.test.ts` imports `#src/client` and tests the *source*, so a broken declaration
      # emit or a `#src` rewrite that stops resolving would first be seen by a consumer of the
      # published package. `smoke.yml` builds too, but it is the browser pass; if it is red for a UI
      # reason, this is the job that still tells you the build itself is fine.
      - name: Build the server, both UIs, the client bundle and its declarations
        run: pnpm run build
