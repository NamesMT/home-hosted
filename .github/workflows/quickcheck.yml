name: Run `quickcheck` script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  main:
    runs-on: ubuntu-latest
    # Lint, types and a full build — a couple of minutes. A stalled runner should not sit
    # for GitHub's 6-hour default before the push is reported as broken.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **A vulnerable shipped dependency is a release-stopper, and nothing checked for one.**
      #
      # Measured on this branch before this step existed: 10 advisories, 2 of them HIGH — six in `hono`
      # (`<4.13.16`: a `mount()` middleware bypass, a router that skips wildcard middleware, `csrf()`
      # missing `text/ping`) and two in `happy-dom`. Both are fixed; the finding is that **nothing would
      # have told anyone**, because `pnpm run check` runs eslint, tsc, vue-tsc, doc links and the suite,
      # and not one of them reads the dependency tree.
      #
      # `--prod` scopes it to what a person actually installs. The dev toolchain carries advisories of
      # its own from time to time (at the time of writing: `eslint`'s `minimatch`, `@vue/test-utils`'
      # `glob`, `@antfu/eslint-config`'s `katex`), and failing a release on a lint rule's transitive
      # dependency teaches people to bypass the check.
      #
      # `--audit-level=high` rather than `moderate`: a high or critical advisory in a *shipped* package is
      # not a judgement call, while a moderate one sometimes is (a bypass that needs a configuration this
      # panel never offers). Raise it when the tree is clean enough to hold that line.
      - name: Audit shipped dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Run quickcheck (lint + types)
        run: pnpm run quickcheck

      # Not redundant with `quickcheck`, and not only "the control UI".
      #
      # `pnpm run build` compiles the server, the stock UI, the published client bundle and — through
      # `scripts/build-types.mjs` — 223 declaration files. **Nothing else in CI exercises that script**:
      # `test/api/client.test.ts` imports `#src/client` and tests the *source*, so a broken declaration
      # emit or a `#src` rewrite that stops resolving would first be seen by a consumer of the
      # published package. `smoke.yml` builds too, but it is the browser pass; if it is red for a UI
      # reason, this is the job that still tells you the build itself is fine.
      - name: Build the server, both UIs, the client bundle and its declarations
        run: pnpm run build
