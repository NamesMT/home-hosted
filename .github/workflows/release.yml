name: Release

# Manual, version-first release. Dispatch with the version to ship:
#   * gates on the macOS and Windows suite (`cross-platform.yml`) at this exact commit,
#     so a platform-specific break cannot be published (a dry run exercises the gate too)
#   * verifies the version, lints/types/tests, then builds the CLI, the stock UI and every
#     UI bundle (`uis/dist/home-hosted-ui-<name>.zip`)
#   * changelogen derives the changelog from conventional commits, bumps package.json,
#     commits and tags `v<version>`
#   * the commit and tag are pushed, a GitHub release is created from the changelog section,
#     and the UI bundles are attached to it
#   * the package is published to npm with trusted publishing (OIDC — no token)
#
# A `dry-run` dispatch runs the gate too and stops before pushing, releasing and publishing.
#
# One-time setup before the first run:
#   * publish the package once by hand: npm only lets you configure a trusted publisher for a
#     package that already exists
#   * on npmjs.com → the package → Settings → Trusted Publisher, add this repository with the
#     workflow filename `release.yml`
#   * the repository is public, so `npm publish --provenance` attaches an attestation that links
#     the tarball to this workflow run (drop the flag if the repo is ever made private again)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without a leading v (e.g. 0.3.0)
        required: true
        type: string
      dry-run:
        description: Stop before pushing, releasing and publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The platform gate: Windows and macOS must pass before anything is tagged or
  # published. It runs from the same commit being released (`./.github/...`, not a branch
  # ref), on a dry run as well — the gate is exactly what a rehearsal needs to exercise.
  cross-platform:
    uses: ./.github/workflows/cross-platform.yml

  release:
    needs: [cross-platform]
    # `always()` because a skipped dependency would otherwise skip this job too, and
    # `needs.*.result` is what makes the gate real: a red platform run stops the release.
    # A dry run still runs the gate — that is the point of rehearsing it.
    if: ${{ always() && needs.cross-platform.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # changelogen needs the tags and the history to build the changelog
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # never cache in a release build
          package-manager-cache: false

      - name: Use a recent npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check the requested version
        run: node scripts/check-release-version.mjs "$VERSION"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, types and tests
        run: pnpm run quickcheck && pnpm exec vitest run

      - name: Build the CLI, the stock UI and the UI bundles
        run: pnpm run build && pnpm run build:uis

      - name: Changelog, version bump, commit and tag
        run: |
          # the runner has no git identity, and changelogen will happily exit 0 after a
          # failed commit — so set one, then assert the release actually happened
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx -y changelogen@latest --release -r "$VERSION" --no-github --clean --hideAuthorEmail
          git tag --points-at HEAD | grep -qx "$TAG" || { echo "::error::changelogen did not create $TAG on a release commit"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$VERSION" || { echo "::error::package.json was not bumped to $VERSION"; exit 1; }

      - name: Push the commit and the tag
        if: ${{ inputs.dry-run != true && inputs.dry-run != 'true' }}
        run: |
          # Hooks and build steps can leave the tree non-empty, and someone may have pushed
          # while this ran: autostash the leftovers, replay the release commit, then push.
          git status --porcelain || true
          for attempt in 1 2 3; do
            git push --follow-tags && exit 0
            echo "push rejected (attempt $attempt) — rebasing on origin/main"
            git fetch --quiet origin main
            git rebase --autostash --quiet origin/main
            # the rebase rewrote the release commit, so the tag has to follow it
            git tag -f -a "$TAG" -m "$TAG"
          done
          echo "could not push the release commit" >&2
          exit 1

      - name: Create the GitHub release with the UI bundles
        if: ${{ inputs.dry-run != true && inputs.dry-run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a process substitution would swallow a failure here, and empty
          # notes still create a release — so check the body before using it
          NOTES="$(mktemp)"
          node scripts/release-notes.mjs "$VERSION" > "$NOTES"
          test -s "$NOTES" || { echo "::error::the release notes for $VERSION came out empty"; exit 1; }
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            uis/dist/*.zip

      - name: Publish to npm
        if: ${{ inputs.dry-run != true && inputs.dry-run != 'true' }}
        run: |
          npm publish --access public --provenance
          # npm accepts the upload and then processes it, which it says can take a few
          # minutes: a one-minute poll called a green publish "not visible" more than once.
          # A trusted publisher can also be configured to stage instead of publishing live,
          # in which case npm holds it for approval — five minutes is long enough that the
          # warning below means something is actually waiting or wrong.
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if npm view "$(node -p "require('./package.json').name")@$VERSION" version >/dev/null 2>&1; then
              echo "live on npm: $(node -p "require('./package.json').name")@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::$VERSION is still not visible on the registry after five minutes — check npmjs.com for a staged publish waiting for approval"

      - name: Summary
        run: |
          {
            echo "### $TAG$( [ "${{ inputs.dry-run }}" = "true" ] && echo ' (dry run)')"
            echo
            echo 'Built UI bundles:'
            ls -1 uis/dist/*.zip | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
