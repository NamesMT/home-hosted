minimumReleaseAgeExcludePrune: true

# `hono@4.13.20` is the patch for six advisories (`<4.13.16`), and it was younger than pnpm's
# minimum release age when this was written. The exclusion is the price of the fix: a supply-chain
# window traded for a known-vulnerable framework. Re-check it on the next dependency pass —
# `minimumReleaseAgeExcludePrune` drops the entry once the package is old enough.
minimumReleaseAgeExclude:
  - hono@4.13.20

trustPolicy: no-downgrade
# vendored/historic transitives that would block the whole tree under no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@3.6.0

shellEmulator: true

overrides:
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  # reka-ui's transitive dep needs its postinstall to pick the Vue 2/3 build
  unrs-resolver: true
  vue-demi: true
