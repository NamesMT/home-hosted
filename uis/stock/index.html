<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Self-hosted control panel that keeps your home-server processes alive: supervision, restarts, port conflicts, logs." />
    <title>home-hosted — control panel</title>
    <script>
      // Applied before the first paint so the shell never flashes the wrong theme, and `lang` is
      // right for the fonts and the screen reader. The translated text itself lands with
      // `initLocale()` in main.ts, which resolves before the app mounts.
      ;(function () {
        try {
          var stored = localStorage.getItem('hh.theme')
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var locale = localStorage.getItem('hh.locale')
          if (locale) document.documentElement.lang = locale
        }
        catch (error) { /* storage unavailable — fall through to light */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
